spring:
  profiles:
    active: dev

jwt:
  # 운영에서는 반드시 환경변수(JWT_SECRET_BASE64)로 교체하세요.
  secret: ${JWT_SECRET_BASE64:VGhpc0lzQVRlbXBEZXZlbG9wbWVudFNlY3JldEtleUZvclRNVEEyMDI2IQ==}
  access-token-validity-seconds: 3153600000
  refresh-token-validity-seconds: 1209600
  issuer: tmta

tmta:
  email:
    verification:
      code-length: 6
      code-ttl-seconds: 180
      verification-token-ttl-seconds: 1800
      resend-cooldown-seconds: 60
      rate-limit-window-seconds: 3600
      max-sends-per-window: 5
      max-verify-attempts: 5
    ses:
      enabled: ${SES_ENABLED:false}
      region: ${AWS_REGION:ap-northeast-2}
      from-address: ${SES_FROM_ADDRESS:no-reply@example.com}
  auth:
    social:
      google:
        enabled: ${SOCIAL_GOOGLE_ENABLED:false}
        issuer: https://accounts.google.com
        jwks-uri: https://www.googleapis.com/oauth2/v3/certs
        audiences: ${SOCIAL_GOOGLE_AUDIENCES:}
      apple:
        enabled: ${SOCIAL_APPLE_ENABLED:false}
        issuer: https://appleid.apple.com
        jwks-uri: https://appleid.apple.com/auth/keys
        audiences: ${SOCIAL_APPLE_AUDIENCES:}
      kakao:
        enabled: ${SOCIAL_KAKAO_ENABLED:false}
        user-info-uri: https://kapi.kakao.com/v2/user/me
      naver:
        enabled: ${SOCIAL_NAVER_ENABLED:false}
        user-info-uri: https://openapi.naver.com/v1/nid/me
  cors:
    allowed-origins:
      - http://localhost:8080
      - https://api.tm-ta.com
